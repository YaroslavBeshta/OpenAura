info:
  contact:
    name: OpenAura
  description: |-
    Open-source user, role, and access management service.
    API version is selected via the X-API-Version header (not the URL path).
    App routes require an app API key (X-API-Key). Admin routes live under /admin and require an admin API key.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: OpenAura API
  version: "1.0"

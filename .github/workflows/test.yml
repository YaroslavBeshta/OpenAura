name: Test

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply migrations
        run: make migrate

      - name: Run tests with coverage
        run: make test-cover

      - name: Coverage summary
        if: always()
        run: |
          if [[ ! -f coverage.out ]]; then
            {
              echo "## Coverage"
              echo ""
              echo "_No coverage.out produced._"
            } | tee coverage-comment.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')"
          {
            echo "## Coverage"
            echo ""
            echo "**Total: ${total}**"
            echo ""
            echo '<details><summary>Package breakdown (bottom 20)</summary>'
            echo ""
            echo '```'
            go tool cover -func=coverage.out | tail -n 20
            echo '```'
            echo ""
            echo '</details>'
          } | tee coverage-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage-comment.md

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
